<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Einmalcodes - Adventskalender für Paare</title>
<style>body{font-family:Georgia,serif;background:#FDF3E3;color:#3B2A20;max-width:640px;margin:0 auto;padding:24px}h1{font-family:cursive;color:#8A1A22;font-size:36px}input,button{font-family:inherit;padding:10px 14px;font-size:16px;border-radius:999px}input{border:1px solid #C9A86A;width:100%;box-sizing:border-box}button{background:#8A1A22;color:#fff;border:none;cursor:pointer;margin-top:10px}button.ghost{background:#FFFDF6;color:#3B2A20;border:1px solid #8A1A22}.code{ background:#fff;border:1px solid #C9A86A;border-radius:12px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{padding:4px 10px;border-radius:999px;font-size:13px}.unused{background:#D6F5E3}.inuse{background:#FFF3CD}.used{background:#F8D7DA}</style>
</head><body>
<h1>Admin - Einmalcodes 🤍</h1>
<p>Nur für dich. Hier erstellst du pro Etsy-Bestellung einen Code.</p>
<label>Master-Passwort</label><input id="pw" type="password" placeholder="Dein Master-Passwort">
<button onclick="loadCodes()">Anmelden + Codes laden</button>
<hr>
<h2>Neuen Code erstellen</h2>
<p>Leer lassen = Zufalls-Code, z.B. PAAR-8472. Oder eigenen Code eintippen.</p>
<input id="newCode" placeholder="z.B. PAAR-8472 (optional)">
<button onclick="createCode()">Neuen Code erstellen</button>
<p id="msg" style="font-weight:bold;color:#8A1A22"></p>
<h2>Alle Codes</h2>
<div id="list"></div>
<script>
let PW='';
async function loadCodes(){ PW=document.getElementById('pw').value; let r=await fetch('/.netlify/functions/list-codes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPassword:PW})}); let j=await r.json(); if(!j.ok){ document.getElementById('msg').textContent=j.error||'Fehler'; return; } let el=document.getElementById('list'); el.innerHTML=''; j.codes.forEach(c=>{ let cls=c.status==='unused'?'unused':c.status==='in-use'?'inuse':'used'; let label=c.status==='unused'?'frei':c.status==='in-use'?'in Benutzung':'verbraucht'; el.innerHTML+='<div class="code"><b>'+c.code+'</b><span class="badge '+cls+'">'+label+'</span><button class="ghost" onclick="copyCode(\''+c.code+'\')">Kopieren</button>'+(c.status!=='unused'?'<button class="ghost" onclick="resetCode(\''+c.code+'\')">Wieder freigeben</button>':'')+'</div>'; }); }
async function createCode(){ let code=document.getElementById('newCode').value.trim().toUpperCase(); let r=await fetch('/.netlify/functions/create-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPassword:PW, code})}); let j=await r.json(); document.getElementById('msg').textContent=j.ok?('Neuer Code: '+j.code+' - bitte per Etsy-Nachricht schicken.'):(j.error||'Fehler'); if(j.ok){ document.getElementById('newCode').value=''; loadCodes(); } }
async function resetCode(code){ if(!confirm('Code '+code+' wirklich wieder freigeben?')) return; let r=await fetch('/.netlify/functions/reset-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPassword:PW, code})}); let j=await r.json(); document.getElementById('msg').textContent=j.ok?('Code '+code+' ist wieder frei.'):(j.error||'Fehler'); loadCodes(); }
function copyCode(code){ navigator.clipboard.writeText(code).then(()=>alert('Code kopiert: '+code)); }
</script></body></html>
